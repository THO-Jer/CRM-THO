                                    <TextAreaField label="Notas" value={formData.notas || ''} onChange={(e) => setFormData({...formData, notas: e.target.value})} />
                                </>)}
                                {type === 'cerrado' && (<>
                                    <InputField label="Organización" required value={formData.organizacion} onChange={(e) => setFormData({...formData, organizacion: e.target.value})} />
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <SelectField label="Tipo" required value={formData.tipo} onChange={(e) => setFormData({...formData, tipo: e.target.value})} options={['Ticket RC Express', 'Ticket Diag Org', 'Ticket ESG', 'Key Account Nivel 1', 'Key Account Nivel 2', 'Key Account Nivel 3']} />
                                        <SelectField label="Estado Final" required value={formData.estado_final} onChange={(e) => setFormData({...formData, estado_final: e.target.value})} options={['Ganado', 'Perdido']} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <InputField label="Valor (UF)" type="number" step="0.01" required value={formData.valor} onChange={(e) => setFormData({...formData, valor: parseFloat(e.target.value) || 0})} />
                                        <InputField label="Fecha Cierre" type="date" required value={formData.fecha_cierre} onChange={(e) => setFormData({...formData, fecha_cierre: e.target.value})} />
                                    </div>
                                    {formData.estado_final === 'Perdido' && <SelectField label="Razón" value={formData.razon_perdida || ''} onChange={(e) => setFormData({...formData, razon_perdida: e.target.value})} options={['Presupuesto', 'Timing', 'Competencia', 'No respondió', 'No calificado', 'Otro']} />}
                                </>)}
                                {type === 'ticket' && (<>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <InputField label="Organización" required value={formData.organizacion} onChange={(e) => setFormData({...formData, organizacion: e.target.value})} />
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Ticket *</label>
                                            <input
                                                list="ticket-sugerencias"
                                                required
                                                value={formData.ticket}
                                                onChange={(e) => setFormData({...formData, ticket: e.target.value})}
                                                className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja"
                                                placeholder="Nombre del ticket..."
                                            />
                                            <datalist id="ticket-sugerencias">
                                                <option value="Ticket RC Express" />
                                                <option value="Ticket Diag Org" />
                                                <option value="Ticket ESG" />
                                            </datalist>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <InputField label="Fecha Inicio" type="date" required value={formData.fecha_inicio} onChange={(e) => setFormData({...formData, fecha_inicio: e.target.value})} />
                                        <InputField label="Fecha Entrega" type="date" required value={formData.fecha_entrega} onChange={(e) => setFormData({...formData, fecha_entrega: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <InputField label="Valor" type="number" step="0.01" required value={formData.valor_monto || 0} onChange={(e) => setFormData({...formData, valor_monto: parseFloat(e.target.value) || 0})} />
                                        <SelectField label="Moneda" required value={formData.valor_moneda || 'UF'} onChange={(e) => setFormData({...formData, valor_moneda: e.target.value})} options={['UF', 'CLP']} />
                                        <InputField label="% Avance" type="number" min="0" max="100" required value={formData.porcentaje_avance} onChange={(e) => setFormData({...formData, porcentaje_avance: parseInt(e.target.value) || 0})} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <SelectField label="Fase" required value={formData.fase_actual} onChange={(e) => setFormData({...formData, fase_actual: e.target.value})} options={['Kick-off', 'Levantamiento', 'Análisis', 'Entrega', 'Cerrado']} />
                                        <InputField label="Responsable" value={formData.responsable || ''} onChange={(e) => setFormData({...formData, responsable: e.target.value})} />
                                    </div>
                                </>)}
                                {type === 'keyaccount' && (<>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <InputField label="Organización" required value={formData.organizacion} onChange={(e) => setFormData({...formData, organizacion: e.target.value})} />
                                        <InputField label="Servicio" required value={formData.servicio} onChange={(e) => setFormData({...formData, servicio: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <InputField label="UF/mes" type="number" step="0.01" required value={formData.uf_mes} onChange={(e) => setFormData({...formData, uf_mes: parseFloat(e.target.value) || 0})} />
                                        <InputField label="Inicio" type="date" required value={formData.inicio_contrato} onChange={(e) => setFormData({...formData, inicio_contrato: e.target.value})} />
                                        <InputField label="Fin" type="date" value={formData.fin_contrato || ''} onChange={(e) => setFormData({...formData, fin_contrato: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <SelectField label="Renovación" value={formData.renovacion} onChange={(e) => setFormData({...formData, renovacion: e.target.value})} options={['Confirmada', 'En conversación', 'No renovará', 'Por definir']} />
                                        <SelectField label="Salud" value={formData.salud} onChange={(e) => setFormData({...formData, salud: e.target.value})} options={['Excelente', 'Buena', 'Riesgo', 'Crítico']} />
                                    </div>
                                </>)}
                                <div className="flex space-x-3 pt-4">
                                    <button type="submit" className="flex-1 px-4 py-2 color-naranja text-white rounded-lg font-medium">Guardar</button>
                                    <button type="button" onClick={onClose} className="flex-1 px-4 py-2 bg-gray-200 rounded-lg font-medium">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function InputField({ label, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label} {props.required && '*'}</label><input {...props} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja" /></div>;
        }

        function SelectField({ label, options, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label} {props.required && '*'}</label><select {...props} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja">{options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select></div>;
        }

        function TextAreaField({ label, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label}</label><textarea {...props} rows="3" className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja" /></div>;
        }


        function HistoryModal({ open, title, items, loading, onClose }) {
            if (!open) return null;

            const formatDT = (dt) => {
                try {
                    const date = new Date(dt);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);
                    const diffHours = Math.floor(diffMs / 3600000);
                    const diffDays = Math.floor(diffMs / 86400000);
                    
                    if (diffMins < 1) return 'Hace unos segundos';
                    if (diffMins < 60) return `Hace ${diffMins} min`;
                    if (diffHours < 24) return `Hace ${diffHours}h`;
                    if (diffDays < 7) return `Hace ${diffDays} día${diffDays > 1 ? 's' : ''}`;
                    return date.toLocaleString('es-CL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                } catch { return dt; }
            };

            const getEventIcon = (eventType) => {
                if (eventType?.includes('insert') || eventType?.includes('created')) return '✨';
                if (eventType?.includes('update')) return '✏️';
                if (eventType?.includes('delete')) return '🗑️';
                if (eventType?.includes('stage') || eventType?.includes('moved')) return '🔄';
                if (eventType?.includes('closed')) return '✅';
                if (eventType?.includes('converted')) return '🔄';
                if (eventType?.includes('renewal')) return '🔑';
                if (eventType?.includes('cancelled')) return '❌';
                return '📝';
            };
            
            const getDetalles = (item) => {
                // Si tiene payload, extraer cambios específicos
                if (item.payload) {
                    const { old: antes, new: despues } = item.payload;
                    const cambios = [];
                    
                    if (antes && despues) {
                        // Detectar cambios específicos
                        const campos = ['organizacion', 'contacto', 'estado', 'fase_actual', 'valor', 'valor_monto', 
                                       'valor_moneda', 'uf_mes', 'tipo', 'ticket', 'servicio', 'salud', 
                                       'probabilidad', 'porcentaje_avance', 'responsable'];
                        
                        campos.forEach(campo => {
                            if (antes[campo] !== despues[campo] && (antes[campo] || despues[campo])) {
                                const labelCampo = campo.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                cambios.push({
                                    campo: labelCampo,
                                    antes: antes[campo] || '(vacío)',
                                    despues: despues[campo] || '(vacío)'
                                });
                            }
                        });
                    }
                    
                    return cambios;
                }
                
                return [];
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[80vh] flex flex-col">
                        <div className="flex items-start justify-between mb-4">
                            <div>
                                <h3 className="text-lg font-bold text-gray-900">📜 Historial de Actividad</h3>
                                <p className="text-sm text-gray-600">{title}</p>
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 text-xl">✕</button>
                        </div>

                        {loading ? (
                            <div className="text-sm text-gray-600 p-4">Cargando historial...</div>
                        ) : (
                            <div className="flex-1 overflow-auto border rounded-lg">
                                {(!items || items.length === 0) ? (
                                    <div className="p-6 text-center">
                                        <div className="text-4xl mb-2">📭</div>
                                        <div className="text-sm font-medium text-gray-700 mb-1">Sin actividad registrada</div>
                                        <div className="text-xs text-gray-500">
                                            Los cambios futuros se registrarán aquí automáticamente
                                        </div>
                                    </div>
                                ) : (
                                    <ul className="divide-y">
                                        {items.map((it, idx) => {
                                            const detalles = getDetalles(it);
                                            const titulo = it.title || it.label || 'Actividad';
                                            
                                            return (
                                                <li key={idx} className="p-4 hover:bg-gray-50">
                                                    <div className="flex items-start space-x-3">
                                                        <span className="text-xl">{getEventIcon(it.event_type || it.label)}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center justify-between">
                                                                <div className="text-sm font-medium text-gray-900">
                                                                    {titulo}
                                                                </div>
                                                                <div className="text-xs text-gray-500">{formatDT(it.created_at)}</div>
                                                            </div>
                                                            {it.email && (
                                                                <div className="text-xs text-gray-600 mt-1">
                                                                    Por: {it.email}
                                                                </div>
                                                            )}
                                                            
                                                            {/* Mostrar detalles de cambios */}
                                                            {detalles.length > 0 && (
                                                                <div className="mt-2 space-y-1">
                                                                    {detalles.map((detalle, i) => (
                                                                        <div key={i} className="text-xs bg-gray-50 p-2 rounded">
                                                                            <span className="font-medium text-gray-700">{detalle.campo}:</span>
                                                                            <span className="text-gray-500 mx-1">{detalle.antes}</span>
                                                                            <span className="text-gray-400">→</span>
                                                                            <span className="text-gray-900 ml-1 font-medium">{detalle.despues}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                            
                                                            {it.kind === 'transition' && it.payload && (
                                                                <div className="text-xs text-gray-600 mt-2 bg-blue-50 p-2 rounded">
                                                                    <span className="font-medium">Transición:</span> {it.payload.from} → {it.payload.to}
                                                                    {it.payload.notes && (
                                                                        <div className="mt-1 text-gray-600">
                                                                            {it.payload.notes}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </li>
                                            );
                                        })}
                                    </ul>
                                )}
                            </div>
                        )}

                        <div className="mt-4 flex justify-end">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800">
                                Cerrar
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function FilesModal({ open, onClose, entityName, files, loading, uploading, onUpload, onDownload, onDelete, getIcon, formatSize }) {
            if (!open) return null;
            
            const fileInputRef = React.useRef(null);
            
            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    onUpload(file);
                    e.target.value = ''; // Reset input
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[80vh] flex flex-col">
                        <div className="flex items-start justify-between mb-4">
                            <div>
                                <h3 className="text-lg font-bold text-gray-900">📎 Archivos Adjuntos</h3>
                                <p className="text-sm text-gray-600">{entityName}</p>
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 text-xl">✕</button>
                        </div>
                        
                        {/* Botón subir */}
                        <div className="mb-4">
                            <input 
                                ref={fileInputRef}
                                type="file" 
                                onChange={handleFileSelect}
                                className="hidden"
                                disabled={uploading}
                            />
                            <button 
                                onClick={() => fileInputRef.current?.click()}
                                disabled={uploading}
                                className="w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg hover:border-naranja hover:bg-orange-50 transition-colors disabled:opacity-50"
                            >
                                {uploading ? (
                                    <span className="text-gray-600">⏳ Subiendo archivo...</span>
                                ) : (
                                    <span className="text-gray-700">📤 Click para subir archivo</span>
                                )}
                            </button>
                            <p className="text-xs text-gray-500 mt-1 text-center">
                                Soporta: PDF, imágenes, Word, Excel (máx. 50MB)
                            </p>
                        </div>
                        
                        {/* Lista de archivos */}
                        <div className="flex-1 overflow-auto border rounded-lg">
                            {loading ? (
                                <div className="p-6 text-center text-sm text-gray-600">Cargando archivos...</div>
                            ) : files.length === 0 ? (
                                <div className="p-6 text-center">
                                    <div className="text-4xl mb-2">📭</div>
                                    <div className="text-sm font-medium text-gray-700 mb-1">Sin archivos</div>
                                    <div className="text-xs text-gray-500">Sube archivos usando el botón de arriba</div>
                                </div>
                            ) : (
                                <ul className="divide-y">
                                    {files.map((file, idx) => {
                                        const displayName = file.name.split('_').slice(1).join('_') || file.name;
                                        return (
                                            <li key={idx} className="p-4 hover:bg-gray-50">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center space-x-3 flex-1 min-w-0">
                                                        <span className="text-2xl">{getIcon(file.name)}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="text-sm font-medium text-gray-900 truncate">
                                                                {displayName}
                                                            </div>
                                                            <div className="text-xs text-gray-500">
                                                                {formatSize(file.metadata?.size)}
                                                                {file.created_at && ` • ${new Date(file.created_at).toLocaleDateString('es-CL')}`}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-2 ml-4">
                                                        <button 
                                                            onClick={() => onDownload(file.name)}
                                                            className="px-3 py-1 text-sm text-azul hover:bg-blue-50 rounded"
                                                        >
                                                            ⬇️ Descargar
                                                        </button>
                                                        <button 
                                                            onClick={() => onDelete(file.name)}
                                                            className="px-3 py-1 text-sm text-red-600 hover:bg-red-50 rounded"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            </li>
                                        );
                                    })}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CRMApp />);
    </script>

</body>
</html>
