// ---- Debug safety net (shows JS errors on screen instead of blank page)
const __renderFatal = (err) => {
    try {
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = `
              <div style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px;">
                <h2 style="margin:0 0 8px 0; font-size:18px;">Se cayó el CRM 😿</h2>
                <div style="font-size:13px; color:#333; line-height:1.4;">
                  <div style="margin-bottom:8px;">Hay un error de JavaScript que dejó la pantalla en blanco.</div>
                  <pre style="white-space:pre-wrap; background:#f6f6f6; padding:12px; border-radius:10px; border:1px solid #ddd;">${String(err && (err.stack || err.message || err))}</pre>
                  <div style="margin-top:10px; font-size:12px; color:#666;">Tip: abre la consola del navegador (F12 → Console) y pega aquí el error si necesitas ayuda.</div>
                </div>
              </div>`;
        }
    } catch (_) {}
};

window.addEventListener('error', (e) => {
    if (e?.error) __renderFatal(e.error);
    else __renderFatal(e?.message || e);
});
window.addEventListener('unhandledrejection', (e) => {
    __renderFatal(e?.reason || e);
});

        const exportToCSV = (data, filename) => {
            if (!data || data.length === 0) { alert('No hay datos'); return; }
            const headers = Object.keys(data[0]);
            const csv = [headers.join(','), ...data.map(row => headers.map(h => JSON.stringify(row[h] || '')).join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();

const items = [
                        ...(events || []).map(e => ({
                            kind: 'event',
                            created_at: e.created_at,
                            label: (e.event_type || 'event').toUpperCase(),
                            title: e.title || '',
                            email: e.created_by_email || '',
                            payload: e.payload
                        })),
                        ...((transitions || []) || []).map(t => ({
                            kind: 'transition',
                            created_at: t.created_at,
                            label: 'TRANSICIÓN',
                            title: t.reason || '',
                            email: '',
                            payload: { from: t.entity_from, to: t.entity_to, notes: t.notes }
                        })),
                        ...(links || []).map(l => ({
                            kind: 'link',
                            created_at: l.created_at,
                            label: 'TRANSICIÓN',
                            title: l.reason || '',
                            email: '',
                            payload: { from: l.from_type, to: l.to_type, notes: l.notes, from_id: l.from_id, to_id: l.to_id }
                        }))
                    ].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

                    setHistoryItems(items);
                } catch (err) {
                    console.error('Error cargando historial:', err);
                    alert('No se pudo cargar el historial: ' + (err?.message || err));
                    setHistoryItems([]);
                } finally {
                    setHistoryLoading(false);
                }
            };


            const handleSaveProspecto = async (data) => {
                if (!requireAuth()) return;
                try {
                    if (editingItem) {
                        const { error } = await supabase.from('prospectos').update(data).eq('id', editingItem.id);
                        if (error) throw error;
                    } else {
                        const { error } = await supabase.from('prospectos').insert([data]);
                        if (error) throw error;
                    }
                    await loadProspectos();
                    setShowModal(false);
                } catch (error) { 
                    console.error('Error completo:', error);
                    alert('Error al guardar: ' + error.message); 
                }
            };

            const handleDeleteProspecto = async (id) => {
                if (!requireAuth()) return;
                if (!confirm('¿Eliminar?')) return;
                const { error } = await supabase.from('prospectos').delete().eq('id', id);
                if (error) alert('Error: ' + error.message);
                else await loadProspectos();
            };

            const handleMoveProspecto = async (prospectoId, nuevoEstado) => {
                if (!requireAuth()) return;
                let probabilidad = 10;
                if (nuevoEstado === 'Reunión agendada') probabilidad = 25;
                if (nuevoEstado === 'Propuesta enviada') probabilidad = 40;
                if (nuevoEstado === 'Negociación') probabilidad = 70;
                const { error } = await supabase.from('prospectos').update({ estado: nuevoEstado, probabilidad }).eq('id', prospectoId);
                if (error) console.error('Error:', error);
                else await loadProspectos();
            };

            const handleCerrarProspecto = async (prospecto, ganado) => {
                if (!requireAuth()) return;
                try {
                    const cerrado = {
                        organizacion: prospecto.organizacion,
                        tipo: prospecto.tipo,
                        estado_final: ganado ? 'Ganado' : 'Perdido',
                        fecha_cierre: new Date().toISOString().split('T')[0],
                        valor: prospecto.valor,
                        razon_perdida: '',
                        escalo: false,
                        valor_total_final: prospecto.valor,
                        fecha_contacto: prospecto.created_at
                    };
                    const { error: insertError } = await supabase.from('cerrados').insert([cerrado]);
                    if (insertError) throw insertError;
                    const { error: deleteError } = await supabase.from('prospectos').delete().eq('id', prospecto.id);
                    if (deleteError) throw deleteError;
                    await loadProspectos();
                    await loadCerrados();
                } catch (error) { alert('Error: ' + error.message); }
            };

            const handleSaveOther = async (type, data) => {
                if (!requireAuth()) return;
                try {
                    const table = type === 'cerrado' ? 'cerrados' : type === 'ticket' ? 'tickets' : 'key_accounts';
                    if (editingItem) {
                        const { error } = await supabase.from(table).update(data).eq('id', editingItem.id);
                        if (error) throw error;
                    } else {
                        const { error } = await supabase.from(table).insert([data]);
                        if (error) throw error;
                    }
                    if (type === 'cerrado') await loadCerrados();
                    if (type === 'ticket') await loadTickets();
                    if (type === 'keyaccount') await loadKeyAccounts();
                    setShowModal(false);
                } catch (error) { alert('Error: ' + error.message); }
            };

            const handleDeleteOther = async (type, id) => {
                if (!requireAuth()) return;
                if (!confirm('¿Eliminar?')) return;
                const table = type === 'cerrado' ? 'cerrados' : type === 'ticket' ? 'tickets' : 'key_accounts';
                const { error } = await supabase.from(table).delete().eq('id', id);
                if (error) alert('Error: ' + error.message);
                else {
                    if (type === 'cerrado') await loadCerrados();
                    if (type === 'ticket') await loadTickets();
                    if (type === 'keyaccount') await loadKeyAccounts();
                }
            };

            // -------------------------
            // Cerrar / finalizar Ticket
            // -------------------------
            const handleCloseTicket = async (ticket) => {
                if (!requireAuth()) return;
                if (!ticket) return;

                // 1) Finalizar ticket
                const ok = confirm(`¿Finalizar este ticket?

${ticket.organizacion} — ${ticket.ticket}

Se marcará como 100% y Cerrado.`);
                if (!ok) return;

                // 2) ¿Registrar también en "Cerrados"?
                const alsoClosed = confirm(`¿Quieres registrar el término del ticket en la pestaña "Cerrados"?

Recomendado: así queda como histórico y después puedes reactivarlo/convertirlo.`);
                let closedOutcome = 'Ganado';
                let lossReason = '';
                let ufValue = '';
                if (alsoClosed) {
                    const opt = prompt('¿Cómo terminó este ticket?

1 = Ganado (finalizado)
2 = Perdido/Cancelado', '1');
                    closedOutcome = (opt === '2') ? 'Perdido' : 'Ganado';
                    ufValue = prompt('UF del ticket (opcional, para métricas). Deja vacío si no aplica.', '') || '';
                    if (closedOutcome === 'Perdido') {
                        lossReason = prompt('Motivo de pérdida/cancelación (opcional)', '') || '';
                    }
                }

                try {
                    const payload = {
                        status: 'Cerrado',
                        porcentaje_avance: 100,
                        fase_actual: ticket.fase_actual || 'Finalizado',
                        updated_at: new Date().toISOString()
                    };

                    const { error } = await supabase
                        .from('tickets')
                        .update(payload)
                        .eq('id', ticket.id);

                    if (error) throw error;

                    await logEvent('tickets', ticket.id, 'ticket_closed', 'Ticket finalizado', { status: 'Cerrado', outcome: alsoClosed ? closedOutcome : null });

                    // 3) Si corresponde, crear registro en "cerrados" + link + evento
                    if (alsoClosed) {
                        const today = new Date().toISOString().split('T')[0];
                        const closedRow = {
                            organizacion: ticket.organizacion,
                            tipo: ticket.ticket,
                            estado_final: closedOutcome,
                            fecha_cierre: today,
                            valor: ufValue ? parseFloat(ufValue) : null,
                            razon_perdida: closedOutcome === 'Perdido' ? lossReason : null,
                            escalo: !!ticket.escalo,
                            valor_total_final: ufValue ? parseFloat(ufValue) : null,
                            fecha_contacto: today
                        };

                        const { data: cData, error: cErr } = await supabase
                            .from('cerrados')
                            .insert([closedRow])
                            .select('*')
                            .single();

                        if (cErr) {
                            console.warn('No se pudo registrar ticket en cerrados:', cErr.message);
                        } else if (cData?.id) {
                            // link suave (si existe)
                            try {
                                await supabase.from('crm_entity_links').insert([{
                                    from_type: 'ticket',
                                    from_id: ticket.id,
                                    to_type: 'cerrado',
                                    to_id: cData.id,
                                    link_type: 'completion'
                                }]);
                            } catch (e) { /* no-op */ }

                            await logEvent('cerrados', cData.id, 'ticket_closed_recorded', 'Ticket registrado en Cerrados', { ticket_id: ticket.id, outcome: closedOutcome });
                            await loadCerrados();
                        }
                    }

                    await loadTickets();
                } catch (err) {
                    alert('Error al finalizar ticket: ' + (err?.message || err));
                }
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="text-xl text-gray-600">Cargando...</div></div>;

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white border-b sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-2xl font-bold text-naranja">CRM THO</h1>
                                    <p className="text-sm text-gray-600">The Human Org</p>
                                </div>
                                <div className="flex items-center space-x-4">
                                    {user && (
                                        <>
                                            <button onClick={() => { setEditingItem(null); setModalType('prospecto'); setShowModal(true); }} className="px-4 py-2 color-naranja text-white rounded-lg font-medium">+ Nuevo Prospecto</button>
                                            <button onClick={() => {
                                                const data = { prospectos, cerrados, tickets, keyAccounts };
                                                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                                                const url = window.URL.createObjectURL(blob);
                                                const a = document.createElement('a');
                                                a.href = url;
                                                a.download = `crm-tho-${new Date().toISOString().split('T')[0]}.json`;
                                                a.click();
                                            }} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-medium">📥 Exportar</button>
                                        </>
                                    )}
                                    <div className="text-sm text-gray-600">
                                        {user ? (
                                            <div className="flex items-center space-x-2">
                                                <span>{user.email}</span>
                                                <button onClick={() => { localStorage.removeItem('crm_tho_email'); setUser(null); }} className="text-xs text-gray-400 hover:text-gray-600">Salir</button>
                                            </div>
                                        ) : (
                                            <button onClick={() => setShowLoginModal(true)} className="px-4 py-2 color-naranja text-white rounded-lg font-medium">Ingresar</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b">
                        <div className="max-w-7xl mx-auto px-4">
                            <nav className="flex space-x-8">
                                {[
                                    { id: 'dashboard', nombre: '📊 Dashboard' },
                                    { id: 'pipeline', nombre: '🎯 Pipeline' },
                                    { id: 'cerrados', nombre: '✅ Cerrados' },
                                    { id: 'tickets', nombre: '🎫 Tickets' },
                                    { id: 'keyaccounts', nombre: '🔑 Key Accounts' }
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`py-4 px-1 border-b-2 font-medium text-sm ${activeTab === tab.id ? 'border-naranja text-naranja' : 'border-transparent text-gray-500'}`}>{tab.nombre}</button>
                                ))}
                            </nav>
                        </div>
                    </div>

                    {activeTab === 'pipeline' && (
                        <div className="bg-white border-b">
                            <div className="max-w-7xl mx-auto px-4 py-3">
                                <div className="flex space-x-4">
                                    <input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="flex-1 px-4 py-2 border rounded-lg" />
                                    <select value={filterTipo} onChange={(e) => setFilterTipo(e.target.value)} className="px-4 py-2 border rounded-lg">
                                        <option value="todos">Todos</option>
                                        <option value="Ticket">Tickets</option>
                                        <option value="Key Account">Key Accounts</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {activeTab === 'dashboard' && <Dashboard metrics={metrics} prospectos={prospectos} />}
                        {activeTab === 'pipeline' && <KanbanBoard onConvert={openConvert} onHistory={openHistory} estados={estadosKanban} prospectosPorEstado={prospectosPorEstado} onEdit={(p) => { if (requireAuth()) { setEditingItem(p); setModalType('prospecto'); setShowModal(true); }}} onDelete={handleDeleteProspecto} onMove={handleMoveProspecto} onCerrar={handleCerrarProspecto} getEstadoFromKey={getEstadoFromKey} />}
                        {activeTab === 'cerrados' && <CerradosView onConvertClosed={openConvertFromCerrado} onHistory={openHistory} cerrados={cerrados} onAdd={() => { if (requireAuth()) { setEditingItem(null); setModalType('cerrado'); setShowModal(true); }}} onEdit={(item) => { if (requireAuth()) { setEditingItem(item); setModalType('cerrado'); setShowModal(true); }}} onDelete={(id) => handleDeleteOther('cerrado', id)} onExport={() => exportToCSV(cerrados, 'cerrados.csv')} />}
                        {activeTab === 'tickets' && <TicketsView onClose={handleCloseTicket} onHistory={openHistory} tickets={tickets} onAdd={() => { if (requireAuth()) { setEditingItem(null); setModalType('ticket'); setShowModal(true); }}} onEdit={(item) => { if (requireAuth()) { setEditingItem(item); setModalType('ticket'); setShowModal(true); }}} onDelete={(id) => handleDeleteOther('ticket', id)} onExport={() => exportToCSV(tickets, 'tickets.csv')} />}
                        {activeTab === 'keyaccounts' && <KeyAccountsView onHistory={openHistory} onRenew={openRenewal} onCancel={openCancelKA} keyAccounts={keyAccounts} onAdd={() => { if (requireAuth()) { setEditingItem(null); setModalType('keyaccount'); setShowModal(true); }}} onEdit={(item) => { if (requireAuth()) { setEditingItem(item); setModalType('keyaccount'); setShowModal(true); }}} onDelete={(id) => handleDeleteOther('keyaccount', id)} onExport={() => exportToCSV(keyAccounts, 'key-accounts.csv')} />}
                    </main>

                    {showModal && <UniversalModal type={modalType} item={editingItem} onSave={(data) => modalType === 'prospecto' ? handleSaveProspecto(data) : handleSaveOther(modalType, data)} onClose={() => setShowModal(false)} />}
                    
                    {historyOpen && <HistoryModal open={historyOpen} title={historyTitle} items={historyItems} loading={historyLoading} onClose={() => { setHistoryOpen(false); setHistoryItems([]); }} />}
                    {convertOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-xl font-bold">Convertir prospecto</h3>
                                        <p className="text-sm text-gray-600">{convertSource?.item?.organizacion}</p>
                                    </div>
                                    <button onClick={closeConvert} className="text-gray-500 hover:text-gray-800">✕</button>
                                </div>

                                <div className="mt-4">
                                    <label className="text-sm font-medium text-gray-700">Destino</label>
                                    <select value={convertTarget} onChange={(e) => setConvertTarget(e.target.value)} className="mt-1 w-full px-3 py-2 border rounded-lg">
                                        <option value="ticket">Ticket (ejecución)</option>
                                        <option value="key_account">Key Account (contrato)</option>
                                    </select>
                                </div>

                                {convertTarget === 'ticket' ? (
                                    <div className="mt-4 space-y-3">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Nombre del ticket</label>
                                            <input value={convertForm.ticket} onChange={(e) => setConvertForm({...convertForm, ticket: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">Inicio</label>
                                                <input type="date" value={convertForm.fecha_inicio} onChange={(e) => setConvertForm({...convertForm, fecha_inicio: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">Entrega</label>
                                                <input type="date" value={convertForm.fecha_entrega} onChange={(e) => setConvertForm({...convertForm, fecha_entrega: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Responsable</label>
                                            <input value={convertForm.responsable} onChange={(e) => setConvertForm({...convertForm, responsable: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" placeholder="Ej: Jere / Vale / ..." />
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mt-4 space-y-3">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Servicio</label>
                                            <input value={convertForm.servicio} onChange={(e) => setConvertForm({...convertForm, servicio: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">UF/mes</label>
                                                <input type="number" step="0.01" value={convertForm.uf_mes} onChange={(e) => setConvertForm({...convertForm, uf_mes: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">Fin contrato</label>
                                                <input type="date" value={convertForm.fin_contrato} onChange={(e) => setConvertForm({...convertForm, fin_contrato: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Inicio contrato</label>
                                            <input type="date" value={convertForm.inicio_contrato} onChange={(e) => setConvertForm({...convertForm, inicio_contrato: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                        </div>
                                    </div>
                                )}

                                <div className="mt-6 flex justify-end space-x-2">
                                    <button onClick={closeConvert} className="px-4 py-2 rounded-lg border">Cancelar</button>
                                    <button onClick={submitConvert} className="px-4 py-2 rounded-lg bg-azul text-white">Convertir</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {renewalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-xl font-bold">{renewalMode === 'cancel' ? 'Cancelar contrato' : 'Renovar contrato'}</h3>
                                        <p className="text-sm text-gray-600">{renewalKA?.organizacion}</p>
                                    </div>
                                    <button onClick={closeRenewal} className="text-gray-500 hover:text-gray-800">✕</button>
                                </div>

                                {renewalMode === 'cancel' ? (
                                    <div className="mt-4 space-y-3">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Motivo de cancelación</label>
                                            <input value={renewalForm.cancel_reason} onChange={(e) => setRenewalForm({...renewalForm, cancel_reason: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" placeholder="Ej: cliente pausó / cambio de foco / ..." />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Notas</label>
                                            <textarea value={renewalForm.notes} onChange={(e) => setRenewalForm({...renewalForm, notes: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" rows="3" />
                                        </div>

                                        <div className="flex items-center space-x-2 pt-1">
                                            <input id="cancelAlsoRegisterLoss" type="checkbox" checked={cancelAlsoRegisterLoss} onChange={(e) => setCancelAlsoRegisterLoss(e.target.checked)} />
                                            <label htmlFor="cancelAlsoRegisterLoss" className="text-sm text-gray-700">
                                                Registrar esta pérdida también en <span className="font-medium">Cerrados</span>
                                            </label>
                                        </div>

                                    </div>
                                ) : (
                                    <div className="mt-4 space-y-3">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">Inicio</label>
                                                <input type="date" value={renewalForm.start_date} onChange={(e) => setRenewalForm({...renewalForm, start_date: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-gray-700">Fin</label>
                                                <input type="date" value={renewalForm.end_date} onChange={(e) => setRenewalForm({...renewalForm, end_date: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">UF/mes</label>
                                            <input type="number" step="0.01" value={renewalForm.uf_mes} onChange={(e) => setRenewalForm({...renewalForm, uf_mes: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700">Notas</label>
                                            <textarea value={renewalForm.notes} onChange={(e) => setRenewalForm({...renewalForm, notes: e.target.value})} className="mt-1 w-full px-3 py-2 border rounded-lg" rows="3" />
                                        </div>

                                        <div className="flex items-center space-x-2 pt-1">
                                            <input id="cancelAlsoRegisterLoss" type="checkbox" checked={cancelAlsoRegisterLoss} onChange={(e) => setCancelAlsoRegisterLoss(e.target.checked)} />
                                            <label htmlFor="cancelAlsoRegisterLoss" className="text-sm text-gray-700">
                                                Registrar esta pérdida también en <span className="font-medium">Cerrados</span>
                                            </label>
                                        </div>

                                    </div>
                                )}

                                <div className="mt-6 flex justify-end space-x-2">
                                    <button onClick={closeRenewal} className="px-4 py-2 rounded-lg border">Cerrar</button>
                                    <button onClick={submitRenewal} className={`px-4 py-2 rounded-lg text-white ${renewalMode === 'cancel' ? 'bg-red-600' : 'bg-verde'}`}>
                                        {renewalMode === 'cancel' ? 'Confirmar cancelación' : 'Confirmar renovación'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLoginModal && <LoginModal onLogin={handleLogin} onClose={() => setShowLoginModal(false)} />}
                </div>
            );
        }

        function LoginModal({ onLogin, onClose }) {
            const [email, setEmail] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                const validEmails = ['jeremias@tho.cl', 'max@tho.cl', 'francisco@tho.cl'];
                if (validEmails.includes(email.toLowerCase())) {
                    onLogin(email);
                } else {
                    alert('Email no autorizado. Contacta al administrador.');
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-8 max-w-md w-full">
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold text-naranja mb-2">CRM THO</h2>
                            <p className="text-sm text-gray-600">Ingresa tu email para continuar</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="tu-email@tho.cl"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-naranja focus:border-transparent"
                                />
                            </div>
                            <button type="submit" className="w-full px-4 py-3 color-naranja text-white rounded-lg font-medium hover:bg-orange-600">
                                Ingresar
                            </button>
                            <button type="button" onClick={onClose} className="w-full px-4 py-2 text-gray-600 text-sm hover:text-gray-800">
                                Ver como invitado
                            </button>
                        </form>

        function Dashboard({ metrics, prospectos }) {
            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-3 gap-6">
                        <MetricCard title="Prospectos" value={metrics.totalProspectos} subtitle="Activos" color="azul" />
                        <MetricCard title="Propuestas" value={metrics.propuestasEnviadas} subtitle="Enviadas" color="naranja" />
                        <MetricCard title="Pipeline" value={`${Math.round(metrics.pipelineTotal)} UF`} subtitle="Total" color="verde" />
                    </div>
                    <div className="grid grid-cols-3 gap-6">

                        <MetricCard title="Hot" value={metrics.proximosCierres} subtitle=">60%" color="fucsia" />

        function MetricCard({ title, value, subtitle, color }) {
            return <div className={`bg-white rounded-lg shadow p-6 border-l-4 border-${color}`}><div className="text-sm text-gray-600 mb-2">{title}</div><div className={`text-3xl font-bold text-${color} mb-1`}>{value}</div><div className="text-xs text-gray-500">{subtitle}</div></div>;
        }

        function KanbanBoard({estados, prospectosPorEstado, onEdit, onDelete, onMove, onCerrar, getEstadoFromKey, onHistory, onConvert}) {
            return (
                <div className="grid grid-cols-4 gap-4">
                    {estados.map(estado => (
                        <KanbanColumn onHistory={onHistory} key={estado.id} estado={estado} prospectos={prospectosPorEstado(estado.id)} onEdit={onEdit} onDelete={onDelete} onMove={onMove} onCerrar={onCerrar} getEstadoFromKey={getEstadoFromKey} onConvert={onConvert} />
                    ))}
                </div>
            );
        }

        function KanbanColumn({estado, prospectos, onEdit, onDelete, onMove, onCerrar, getEstadoFromKey, onHistory, onConvert}) {
            const handleDragStart = (e, p) => { e.dataTransfer.setData('prospectoId', p.id); e.currentTarget.classList.add('dragging'); };
            const handleDragEnd = (e) => { e.currentTarget.classList.remove('dragging'); };
            const handleDragOver = (e) => { e.preventDefault(); };
            const handleDrop = (e) => { e.preventDefault(); const id = e.dataTransfer.getData('prospectoId'); onMove(id, getEstadoFromKey(estado.id)); };

            return (
                <div className="bg-gray-100 rounded-lg p-4 kanban-column" onDragOver={handleDragOver} onDrop={handleDrop}>
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="font-semibold text-gray-800">{estado.emoji} {estado.nombre}</h3>
                        <span className="text-xs bg-white px-2 py-1 rounded">{prospectos.length}</span>
                    </div>
                    <div className="space-y-3">
                        {prospectos.map(p => <ProspectoCard key={p.id} prospecto={p} onEdit={() => onEdit(p)} onDelete={() => onDelete(p.id)} onCerrar={onCerrar} onConvert={onConvert} onHistory={() => onHistory('prospectos', p.id, p.organizacion)} onDragStart={handleDragStart} onDragEnd={handleDragEnd} />)}
                    </div>
                </div>
            );
        }

        function ProspectoCard({ prospecto, onEdit, onDelete, onCerrar, onConvert, onHistory, onDragStart, onDragEnd }) {
            const [showActions, setShowActions] = useState(false);
            const isOverdue = new Date(prospecto.fecha_limite) < new Date();
            
            return (
                <div draggable onDragStart={(e) => onDragStart(e, prospecto)} onDragEnd={onDragEnd} className={`bg-white rounded-lg p-4 shadow-sm hover:shadow-md cursor-move border-l-4 ${isOverdue ? 'border-red-500' : 'border-azul'}`}>
                    <div onClick={onEdit}>
                        <h4 className="font-semibold text-gray-900 mb-1">{prospecto.organizacion}</h4>
                        <p className="text-sm text-gray-600 mb-2">{prospecto.contacto}</p>
                        <div className="flex justify-between text-xs text-gray-500 mb-2">
                            <span>{prospecto.tipo}</span>
                            <span className="font-semibold text-naranja">{prospecto.valor} UF</span>
                        </div>
                        <div className="flex justify-between text-xs mb-2">
                            <span className={isOverdue ? 'text-red-600 font-medium' : 'text-gray-500'}>📅 {prospecto.fecha_limite}</span>
                            <span className="text-verde">{prospecto.probabilidad}%</span>
                        </div>
                        <p className="text-xs text-gray-500">{prospecto.proximo_paso}</p>
                    </div>
                    <div className="flex space-x-2 pt-3 border-t border-gray-100 mt-3">
                        <button onClick={(e) => { e.stopPropagation(); onEdit(); }} className="flex-1 text-xs text-azul">✏️ Editar</button>
                        <button onClick={(e) => { e.stopPropagation(); onHistory && onHistory(); }} className="flex-1 text-xs text-gray-700">🕘 Historial</button>
                        <button onClick={(e) => { e.stopPropagation(); setShowActions(!showActions); }} className="flex-1 text-xs text-verde">✅ Cerrar</button>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="flex-1 text-xs text-red-500">🗑️</button>
                    </div>
                    {showActions && (
                        <div className="flex space-x-2 mt-2 pt-2 border-t">
                            <button onClick={(e) => { e.stopPropagation(); onCerrar(prospecto, true); setShowActions(false); }} className="flex-1 text-xs bg-green-100 text-green-800 py-1 rounded">Ganado</button>
                            <button onClick={(e) => { e.stopPropagation(); onCerrar(prospecto, false); setShowActions(false); }} className="flex-1 text-xs bg-red-100 text-red-800 py-1 rounded">Perdido</button>
                            <button onClick={(e) => { e.stopPropagation(); onConvert && onConvert(prospecto); setShowActions(false); }} className="flex-1 text-xs bg-blue-100 text-blue-800 py-1 rounded">Convertir</button>
                        </div>
                    )}
                </div>
            );
        }

                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Valor</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
                                    <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">

                                            {onConvertClosed && (

                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function TicketsView({tickets, onAdd, onEdit, onDelete, onExport, onHistory, onClose}) {
            return (
                <div className="space-y-6">
                    <div className="flex justify-between">
                        <h2 className="text-2xl font-bold">Tickets</h2>

        function KeyAccountsView({keyAccounts, onAdd, onEdit, onDelete, onExport, onHistory, onRenew, onCancel}) {

                if (type === 'cerrado') return { organizacion: '', tipo: 'Ticket RC Express', estado_final: 'Ganado', fecha_cierre: new Date().toISOString().split('T')[0], valor: '', razon_perdida: '' };
                if (type === 'ticket') return { organizacion: '', ticket: 'Ticket RC Express', fecha_inicio: new Date().toISOString().split('T')[0], fecha_entrega: '', fase_actual: 'Kick-off', porcentaje_avance: 0, responsable: '' };
                if (type === 'keyaccount') return { organizacion: '', servicio: 'RC Nivel 3', uf_mes: '', inicio_contrato: '', fin_contrato: '', renovacion: 'Por definir', salud: 'Buena' };

            const [formData, setFormData] = useState(item || getDefault(type));
            
            const titles = { prospecto: 'Prospecto', cerrado: 'Cerrado', ticket: 'Ticket', keyaccount: 'Key Account' };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

                                        <SelectField label="Estado" required value={formData.estado} onChange={(e) => setFormData({...formData, estado: e.target.value})} options={['Contactado', 'Reunión agendada', 'Propuesta enviada', 'Negociación']} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">

                                    </div>
                                    <InputField label="Próximo Paso" required value={formData.proximo_paso} onChange={(e) => setFormData({...formData, proximo_paso: e.target.value})} />
                                    <TextAreaField label="Notas" value={formData.notas || ''} onChange={(e) => setFormData({...formData, notas: e.target.value})} />

                                {type === 'keyaccount' && (<>
                                    <div className="grid grid-cols-2 gap-4">
                                        <InputField label="Organización" required value={formData.organizacion} onChange={(e) => setFormData({...formData, organizacion: e.target.value})} />
                                        <InputField label="Servicio" required value={formData.servicio} onChange={(e) => setFormData({...formData, servicio: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <InputField label="UF/mes" type="number" step="0.01" required value={formData.uf_mes} onChange={(e) => setFormData({...formData, uf_mes: parseFloat(e.target.value) || 0})} />

                                    </div>
                                </>)}
                                <div className="flex space-x-3 pt-4">
                                    <button type="submit" className="flex-1 px-4 py-2 color-naranja text-white rounded-lg font-medium">Guardar</button>
                                    <button type="button" onClick={onClose} className="flex-1 px-4 py-2 bg-gray-200 rounded-lg font-medium">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function InputField({ label, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label} {props.required && '*'}</label><input {...props} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja" /></div>;
        }

        function SelectField({ label, options, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label} {props.required && '*'}</label><select {...props} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja">{options.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select></div>;
        }

        function TextAreaField({ label, ...props }) {
            return <div><label className="block text-sm font-medium text-gray-700 mb-1">{label}</label><textarea {...props} rows="3" className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-naranja" /></div>;
        }


        function HistoryModal({ open, title, items, loading, onClose }) {
            if (!open) return null;

            const formatDT = (dt) => {
                try { return new Date(dt).toLocaleString('es-CL'); } catch { return dt; }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-6 max-w-2xl w-full mx-4">
                        <div className="flex items-start justify-between mb-4">
                            <div>
                                <h3 className="text-lg font-bold text-gray-900">Actividad</h3>
                                <p className="text-sm text-gray-600">{title}</p>
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800">✕</button>
                        </div>

                        {loading ? (
                            <div className="text-sm text-gray-600">Cargando historial...</div>
                        ) : (
                            <div className="max-h-[60vh] overflow-auto border rounded-lg">
                                {(!items || items.length === 0) ? (
                                    <div className="p-4 text-sm text-gray-600">Aún no hay actividad registrada.</div>
                                ) : (
                                    <ul className="divide-y">
                                        {items.map((it, idx) => (
                                            <li key={idx} className="p-3">
                                                <div className="flex items-center justify-between">
                                                    <div className="text-xs font-semibold text-gray-700">{it.label}</div>
                                                    <div className="text-xs text-gray-500">{formatDT(it.created_at)}</div>
                                                </div>
                                                {it.title && <div className="text-sm text-gray-900 mt-1">{it.title}</div>}
                                                {it.email && <div className="text-xs text-gray-500 mt-1">{it.email}</div>}
                                                {it.kind === 'transition' && it.payload && (
                                                    <div className="text-xs text-gray-600 mt-2">
                                                        <span className="font-medium">De:</span> {it.payload.from} → <span className="font-medium">A:</span> {it.payload.to}
                                                        {it.payload.notes ? <div className="mt-1"><span className="font-medium">Notas:</span> {it.payload.notes}</div> : null}
                                                    </div>
                                                )}
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                        )}

                        <div className="mt-4 flex justify-end">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-800">Cerrar</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CRMApp />);
    </script>
</body>
</html>
